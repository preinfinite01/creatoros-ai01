openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CreatorOS AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai-tools
    description: CreatorOS AI generation tools
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AI TOOLS ────────────────────────────────────────────────────────────────
  /ai/generate-titles:
    post:
      operationId: generateTitles
      tags: [ai-tools]
      summary: Generate viral video titles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleGeneratorInput"
      responses:
        "200":
          description: Generated titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleGeneratorOutput"

  /ai/generate-hooks:
    post:
      operationId: generateHooks
      tags: [ai-tools]
      summary: Generate attention-grabbing hooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookGeneratorInput"
      responses:
        "200":
          description: Generated hooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookGeneratorOutput"

  /ai/generate-script:
    post:
      operationId: generateScript
      tags: [ai-tools]
      summary: Generate full creator script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptGeneratorInput"
      responses:
        "200":
          description: Generated script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptGeneratorOutput"

  /ai/generate-ideas:
    post:
      operationId: generateIdeas
      tags: [ai-tools]
      summary: Generate content ideas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaGeneratorInput"
      responses:
        "200":
          description: Generated ideas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaGeneratorOutput"

  /ai/generate-workflow:
    post:
      operationId: generateWorkflow
      tags: [ai-tools]
      summary: Run full creator workflow chain (Idea → Hook → Title → Script → CTA → Caption → Hashtags)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "200":
          description: Complete workflow output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowOutput"

  # ── OPENAI CONVERSATIONS ─────────────────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /openai/generate-image:
    post:
      operationId: generateOpenaiImage
      tags: [openai]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiImageInput"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiImageOutput"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── AI TOOLS SCHEMAS ──────────────────────────────────────────────────────
    TitleGeneratorInput:
      type: object
      properties:
        topic:
          type: string
        niche:
          type: string
        platform:
          type: string
          enum: [tiktok, youtube, instagram, youtube_shorts]
        tone:
          type: string
        count:
          type: integer
      required:
        - topic
        - platform

    TitleGeneratorOutput:
      type: object
      properties:
        titles:
          type: array
          items:
            type: string
        creditsUsed:
          type: integer
      required:
        - titles
        - creditsUsed

    HookGeneratorInput:
      type: object
      properties:
        topic:
          type: string
        niche:
          type: string
        platform:
          type: string
          enum: [tiktok, youtube, instagram, youtube_shorts]
        tone:
          type: string
        count:
          type: integer
      required:
        - topic
        - platform

    HookGeneratorOutput:
      type: object
      properties:
        hooks:
          type: array
          items:
            type: string
        creditsUsed:
          type: integer
      required:
        - hooks
        - creditsUsed

    ScriptGeneratorInput:
      type: object
      properties:
        topic:
          type: string
        niche:
          type: string
        platform:
          type: string
          enum: [tiktok, youtube, instagram, youtube_shorts, youtube_longform]
        tone:
          type: string
        duration:
          type: string
          enum: [short, medium, long]
        hook:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
      required:
        - topic
        - platform
        - duration

    ScriptGeneratorOutput:
      type: object
      properties:
        script:
          type: string
        hook:
          type: string
        cta:
          type: string
        estimatedDuration:
          type: string
        creditsUsed:
          type: integer
      required:
        - script
        - hook
        - cta
        - estimatedDuration
        - creditsUsed

    IdeaGeneratorInput:
      type: object
      properties:
        niche:
          type: string
        platform:
          type: string
          enum: [tiktok, youtube, instagram, youtube_shorts]
        tone:
          type: string
        count:
          type: integer
      required:
        - niche
        - platform

    IdeaGeneratorOutput:
      type: object
      properties:
        ideas:
          type: array
          items:
            $ref: "#/components/schemas/ContentIdea"
        creditsUsed:
          type: integer
      required:
        - ideas
        - creditsUsed

    ContentIdea:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        viralPotential:
          type: string
          enum: [high, medium, low]
        tags:
          type: array
          items:
            type: string
      required:
        - title
        - description
        - viralPotential
        - tags

    WorkflowInput:
      type: object
      properties:
        topic:
          type: string
        niche:
          type: string
        platform:
          type: string
          enum: [tiktok, youtube, instagram, youtube_shorts, youtube_longform]
        tone:
          type: string
        duration:
          type: string
          enum: [short, medium, long]
      required:
        - topic
        - platform

    WorkflowOutput:
      type: object
      properties:
        idea:
          type: string
        hook:
          type: string
        title:
          type: string
        script:
          type: string
        cta:
          type: string
        caption:
          type: string
        hashtags:
          type: array
          items:
            type: string
        creditsUsed:
          type: integer
      required:
        - idea
        - hook
        - title
        - script
        - cta
        - caption
        - hashtags
        - creditsUsed

    # ── OPENAI SCHEMAS ────────────────────────────────────────────────────────
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiImageInput:
      type: object
      properties:
        prompt:
          type: string
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
      required:
        - prompt

    OpenaiImageOutput:
      type: object
      properties:
        b64_json:
          type: string
      required:
        - b64_json
